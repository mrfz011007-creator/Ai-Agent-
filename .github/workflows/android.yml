name: Android APK

on:
  workflow_dispatch:
  push:
    branches: ["experiment/**"]
  pull_request:

jobs:
  export:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Godot templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          if [ -d /root/.local/share/godot/export_templates/4.3.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable
          fi
      - name: Validate Godot project
        run: |
          godot --headless --path godot --editor --quit
      - name: Export Android debug APK
        run: |
          mkdir -p godot/build
          godot --headless --path godot --verbose --export-debug "Android" build/EchoesOfTheForgotten.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Echoes-of-the-Forgotten-debug
          path: godot/build/EchoesOfTheForgotten.apk
          if-no-files-found: error
