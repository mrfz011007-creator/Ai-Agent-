name: Architecture Tests

on:
  push:
    branches:
      - main
      - "agent/**"
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile all Python sources
        run: python -m compileall -q .
      - name: Run repository tests
        run: python -m pytest -q
      - name: Static correctness checks
        run: python -m pip install ruff && python -m ruff check core execution security verification agent.py conversation.py intent_router.py local_router.py llm.py key_manager.py memory.py memory_context.py memory_policy.py permissions.py registry.py tools.py --select F,E9
      - name: Security scan
        run: python -m pip install bandit && python -m bandit -r core execution security verification tools.py memory.py -ll
